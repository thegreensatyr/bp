<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password — Brandparent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
--ink:#1c1b2e; --ink-soft:#2a2940; --cream:#faf7f2; --paper:#ffffff;
--brand:#9B7FC4; --brand-deep:#5B4A7E; --silver:#c9c6d3; --silver-deep:#6b6880;
--muted:#6b6880; --line:#e8e4dc; --radius:16px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;color:var(--ink);background:var(--cream);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
h1{font-family:'Fraunces',serif;font-size:1.7rem;margin-bottom:6px}
a{color:var(--brand-deep);text-decoration:none;font-weight:600}
a:hover{text-decoration:underline}
.card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:40px 36px;width:100%;max-width:400px;box-shadow:0 20px 50px rgba(28,27,46,.08)}
.logo{display:flex;align-items:center;gap:10px;font-family:'Fraunces',serif;font-weight:700;font-size:1.15rem;margin-bottom:28px}
.logo img{height:26px;width:auto}
.sub{color:var(--muted);font-size:.92rem;margin-bottom:24px}
label{display:block;font-size:.78rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}
input{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;font-family:inherit;font-size:.95rem;background:var(--cream);outline:none}
input:focus{border-color:var(--brand)}
.btn{width:100%;margin-top:24px;padding:13px 20px;border-radius:999px;border:none;background:var(--ink);color:#fff;font-weight:600;font-size:.95rem;cursor:pointer;transition:transform .15s}
.btn:hover{transform:translateY(-1px)}
.btn:disabled{opacity:.6;cursor:default;transform:none}
.msg{margin-top:16px;font-size:.88rem;padding:10px 14px;border-radius:10px;display:none}
.msg.err{background:rgba(192,57,43,.08);color:#c0392b;display:block}
.msg.ok{background:rgba(155,127,196,.12);color:var(--brand-deep);display:block}
.foot{margin-top:22px;text-align:center;font-size:.9rem;color:var(--muted)}
</style>
</head>
<body>
<div class="card">
<div class="logo"><img src="brandparent-logo.png" alt="" onerror="this.style.display='none'"> Brandparent</div>
<h1>Reset your password</h1>
<p class="sub">Enter the email on your account and we'll send a reset link.</p>

<form id="reset-form">
<label>Email</label>
<input type="email" id="email" required autocomplete="email">
<button class="btn" type="submit" id="submit-btn">Send reset link</button>
<div class="msg" id="msg"></div>
</form>

<div class="foot"><a href="login.html">← Back to log in</a></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script>
document.getElementById('reset-form').addEventListener('submit', async (e) => {
e.preventDefault();
const btn = document.getElementById('submit-btn');
const msg = document.getElementById('msg');
msg.className = 'msg';
btn.disabled = true; btn.textContent = 'Sending…';

const email = document.getElementById('email').value.trim();

const { error } = await sb.auth.resetPasswordForEmail(email, {
redirectTo: window.location.origin + '/update-password.html'
});

// Deliberately show the same success message whether or not the email
// exists — this is standard practice so the form can't be used to check
// which emails have Brandparent accounts.
msg.className = 'msg ok';
msg.textContent = "If an account exists for that email, a reset link is on its way. Check your inbox (and spam folder).";
btn.disabled = false; btn.textContent = 'Send reset link';

if (error) console.error('resetPasswordForEmail error:', error.message);
});
</script>
</body>
</html>
